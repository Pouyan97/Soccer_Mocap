[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soccer-mocap"
version = "0.1.0"
description = "Single-camera markerless motion capture and analysis for soccer, including goalkeeper-specific tracking."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Runtime dependencies are installed by mamba from environment.yml, not by pip.
# They are mirrored here only so `pip install -e .` inside the activated
# environment knows what the package expects. Keep the two files in sync.
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyyaml>=6",
    "pydantic>=2.6",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff"]

[project.scripts]
soccer-mocap = "soccer_mocap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "apps", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
